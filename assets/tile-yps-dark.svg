<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 248" width="500" height="248" role="img" aria-label="YPS Store Finder">
  <defs>
    <filter id="card-shadow-dark" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Card Rectangle with elevation shadow -->
  <rect x="8" y="6" width="484" height="232" rx="14" fill="#313335" stroke="#3c3f41" filter="url(#card-shadow-dark)"/>
  <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#dfdfdf">YPS Store Finder</text>
  <text x="32" y="68" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#808080">github.com/phonewinttun-dev/YPS-Store-Finder</text>
  <text x="32" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#808080">Store locator service enabling Yangon bus commuters</text>
<text x="32" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#808080">to discover verified card service centers and top-up</text>
<text x="32" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#808080">retail touchpoints for Yangon Payment Services (YPS)</text>
<text x="32" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#808080">with fast, lightweight SQLite data persistence.</text>
  <rect x="32" y="196" width="31.0" height="24" rx="6" fill="#2b2b2b" stroke="#3c3f41"/>
<text x="47.5" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cc7832">C#</text>
<rect x="71.0" y="196" width="68.5" height="24" rx="6" fill="#2b2b2b" stroke="#3c3f41"/>
<text x="105.25" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cc7832">.NET 10</text>
<rect x="147.5" y="196" width="61.0" height="24" rx="6" fill="#2b2b2b" stroke="#3c3f41"/>
<text x="178.0" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cc7832">SQLite</text>
<rect x="216.5" y="196" width="76.0" height="24" rx="6" fill="#2b2b2b" stroke="#3c3f41"/>
<text x="254.5" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cc7832">REST API</text>
</svg>