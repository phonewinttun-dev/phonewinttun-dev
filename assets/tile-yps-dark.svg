<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 248" width="500" height="248" role="img" aria-label="YPS Store Finder">
  <defs>
    <filter id="card-shadow-dark" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Surface -->
  <rect x="8" y="6" width="484" height="232" rx="14" fill="#1e1e1e" stroke="#3f3f46" filter="url(#card-shadow-dark)"/>

  <!-- Tab Bar Header -->
  <path d="M8 20A14 14 0 0 1 22 6H478A14 14 0 0 1 492 20V40H8Z" fill="#252526"/>
  <line x1="8" y1="40" x2="492" y2="40" stroke="#3f3f46" stroke-width="1"/>

  <!-- Active Tab -->
  <path d="M20 10 H208 V40 H20 Z" fill="#1e1e1e"/>
  <line x1="20" y1="10" x2="20" y2="40" stroke="#3f3f46"/>
  <line x1="208" y1="10" x2="208" y2="40" stroke="#3f3f46"/>
  <line x1="20" y1="39.5" x2="208" y2="39.5" stroke="#007acc" stroke-width="2.5"/>

  <!-- Tab Icon -->
  <rect x="30" y="16" width="16" height="16" rx="3.5" fill="#7160e8"/>
  <text x="38" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff">C#</text>

  <!-- Tab Title & Close Button -->
  <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#dcdcdc">YPS Store Finder</text>
  <text x="196" y="26" font-family="sans-serif" font-size="13" fill="#858585">×</text>

  <!-- Window Controls (─ □ ✕) -->
  <g transform="translate(432, 18)" stroke="#858585" stroke-width="1.2" fill="none">
    <line x1="0" y1="7" x2="9" y2="7"/>
    <rect x="18" y="2" width="8" height="8" rx="1"/>
    <path d="M36 2 L43 9 M43 2 L36 9"/>
  </g>

  <!-- Card Body -->
  <text x="32" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#4ec9b0">YPS Store Finder</text>
  <text x="32" y="90" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#858585">github.com/phonewinttun-dev/YPS-Store-Finder</text>

  <!-- Description -->
  <text x="32" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cccccc">Store locator service enabling Yangon bus commuters</text>
  <text x="32" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cccccc">to discover verified card service centers and top-up</text>
  <text x="32" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cccccc">retail touchpoints for Yangon Payment Services (YPS)</text>
  <text x="32" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cccccc">with fast, lightweight SQLite data persistence.</text>

  <!-- Tech Badges -->
  <rect x="32.0" y="196" width="33.6" height="24" rx="6" fill="#252526" stroke="#3f3f46"/>
  <text x="48.8" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#9cdcfe">C#</text>
  <rect x="73.6" y="196" width="72.6" height="24" rx="6" fill="#252526" stroke="#3f3f46"/>
  <text x="109.9" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#9cdcfe">.NET 10</text>
  <rect x="154.2" y="196" width="64.8" height="24" rx="6" fill="#252526" stroke="#3f3f46"/>
  <text x="186.6" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#9cdcfe">SQLite</text>
  <rect x="227.0" y="196" width="80.4" height="24" rx="6" fill="#252526" stroke="#3f3f46"/>
  <text x="267.2" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#9cdcfe">REST API</text>
</svg>
