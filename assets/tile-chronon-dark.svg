<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 248" width="500" height="248" role="img" aria-label="Chronon Attendance Tracker">
  <defs>
    <filter id="card-shadow-dark" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Card Rectangle with elevation shadow -->
  <rect x="8" y="6" width="484" height="232" rx="14" fill="#313335" stroke="#3c3f41" filter="url(#card-shadow-dark)"/>
  <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#dfdfdf">Chronon Attendance Tracker</text>
  <text x="32" y="68" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#808080">github.com/phonewinttun-dev/Chronon-Attendance-Tracker</text>
  <text x="32" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#808080">Enterprise attendance and time-tracking system featuring</text>
<text x="32" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#808080">a Blazor WebAssembly frontend and ASP.NET Core backend.</text>
<text x="32" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#808080">Automated check-in reporting, domain validation, and</text>
<text x="32" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#808080">role-based authorization.</text>
  <rect x="32" y="196" width="31.0" height="24" rx="6" fill="#2b2b2b" stroke="#3c3f41"/>
<text x="47.5" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cc7832">C#</text>
<rect x="71.0" y="196" width="98.5" height="24" rx="6" fill="#2b2b2b" stroke="#3c3f41"/>
<text x="120.25" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cc7832">Blazor WASM</text>
<rect x="177.5" y="196" width="91.0" height="24" rx="6" fill="#2b2b2b" stroke="#3c3f41"/>
<text x="223.0" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cc7832">PostgreSQL</text>
<rect x="276.5" y="196" width="68.5" height="24" rx="6" fill="#2b2b2b" stroke="#3c3f41"/>
<text x="310.75" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cc7832">.NET 10</text>
</svg>