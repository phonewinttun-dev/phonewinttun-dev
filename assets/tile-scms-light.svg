<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 248" width="500" height="248" role="img" aria-label="SCMS">
  <defs>
    <filter id="card-shadow-light" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Rectangle with elevation shadow -->
  <rect x="8" y="6" width="484" height="232" rx="14" fill="#ffffff" stroke="#d0d7de" filter="url(#card-shadow-light)"/>
  <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#1f2328">SCMS</text>
  <text x="32" y="68" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#777777">github.com/phonewinttun-dev/SCMS</text>
  <text x="32" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#777777">Smart Clinic Management System engineered with feature-based</text>
<text x="32" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#777777">architecture. Features real-time queue orchestration with</text>
<text x="32" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#777777">SignalR, electronic medical records (EMR), and automated</text>
<text x="32" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#777777">FIFO pharmaceutical inventory tracking.</text>
