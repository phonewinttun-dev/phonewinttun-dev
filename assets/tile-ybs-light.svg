<rect x="192.5" y="196" width="53.5" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="219.25" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#000080">React</text>
<rect x="254.0" y="196" width="68.5" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="288.25" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#000080">Flutter</text>
