<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 248" width="500" height="248" role="img" aria-label="YBS LanPya">
  <defs>
    <filter id="card-shadow-light" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Card Rectangle with elevation shadow -->
  <rect x="8" y="6" width="484" height="232" rx="14" fill="#ffffff" stroke="#d0d7de" filter="url(#card-shadow-light)"/>
  <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#1f2328">YBS LanPya</text>
  <text x="32" y="68" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#777777">github.com/Isnotavailble/YBS-Project</text>
  <text x="32" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#777777">Public transit route navigation platform for commuters</text>
<text x="32" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#777777">in Yangon. Built with a Spring Boot backend, React web client,</text>
<text x="32" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#777777">and Flutter mobile app to index routes and verified stops.</text>
<text x="32" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#777777">Backed by PostgreSQL.</text>
  <rect x="32" y="196" width="46.0" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="55.0" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#000080">Java</text>
