<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 248" width="500" height="248" role="img" aria-label="YBS LanPya">
  <defs>
    <filter id="card-shadow-light" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Surface -->
  <rect x="8" y="6" width="484" height="232" rx="14" fill="#ffffff" stroke="#d0d7de" filter="url(#card-shadow-light)"/>

  <!-- Tab Bar Header -->
  <path d="M8 20A14 14 0 0 1 22 6H478A14 14 0 0 1 492 20V40H8Z" fill="#f6f8fa"/>
  <line x1="8" y1="40" x2="492" y2="40" stroke="#d0d7de" stroke-width="1"/>

  <!-- Active Tab -->
  <path d="M20 10 H163 V40 H20 Z" fill="#ffffff"/>
  <line x1="20" y1="10" x2="20" y2="40" stroke="#d0d7de"/>
  <line x1="163" y1="10" x2="163" y2="40" stroke="#d0d7de"/>
  <line x1="20" y1="39.5" x2="163" y2="39.5" stroke="#007acc" stroke-width="2.5"/>

  <!-- Tab Icon -->
  <rect x="30" y="16" width="16" height="16" rx="3.5" fill="#e76f00"/>
  <text x="38" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff">☕</text>

  <!-- Tab Title & Close Button -->
  <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">YBS LanPya</text>
  <text x="151" y="26" font-family="sans-serif" font-size="13" fill="#858585">×</text>

  <!-- Window Controls (─ □ ✕) -->
  <g transform="translate(432, 18)" stroke="#858585" stroke-width="1.2" fill="none">
    <line x1="0" y1="7" x2="9" y2="7"/>
    <rect x="18" y="2" width="8" height="8" rx="1"/>
    <path d="M36 2 L43 9 M43 2 L36 9"/>
  </g>

  <!-- Card Body -->
  <text x="32" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0550ae">YBS LanPya</text>
  <text x="32" y="90" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#656d76">github.com/Isnotavailble/YBS-Project</text>

  <!-- Description -->
  <text x="32" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#57606a">Public transit route navigation platform for commuters</text>
  <text x="32" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#57606a">in Yangon. Built with a Spring Boot backend, React web client,</text>
  <text x="32" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#57606a">and Flutter mobile app to index routes and verified stops.</text>
  <text x="32" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#57606a">Backed by PostgreSQL.</text>

  <!-- Tech Badges -->
  <rect x="32.0" y="196" width="49.2" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56.6" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0969da">Java</text>
  <rect x="89.2" y="196" width="103.8" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="141.1" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0969da">Spring Boot</text>
  <rect x="201.0" y="196" width="57.0" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="229.5" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0969da">React</text>
  <rect x="266.0" y="196" width="72.6" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="302.3" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0969da">Flutter</text>
</svg>
