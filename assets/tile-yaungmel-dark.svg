<text x="32" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#768390">in Myanmar. Features Next.js frontend with ASP.NET Core</text>
<text x="32" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#768390">backend, fast checkout workflow, inventory tracking, and</text>
